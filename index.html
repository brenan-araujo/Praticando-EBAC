<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Form JS em HTML</title>
</head>
<body>
    <div class="container">
        <h1>ARAS Banking</h1>
        <h2>Depósitos</h2>
        <form id="form-deposito">
            <input type="text" id="nome-beneficiario" required placeholder="Digite o nome completo" >
            <p class="error-message">
                Digite o nome completo
            </p>
            <input type="number" id="numero-conta" required placeholder="Digite o número da conta">
            <input type="number" id="valor-deposito" required placeholder="Digite o valor a ser depositado">
            <textarea id="descricao" placeholder="Descrição (Opcional)">Descrição (Opcional)</textarea>
            <button id="btn-depositar"  type="submit">Depositar</button>
        </form>
        <p class="success-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
